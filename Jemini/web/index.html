<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAELUM : 제미니 웹 데모</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="statusbar"><span id="status" class="status wait">제미니 연결 중…</span></div>
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="panel">
      <div id="log" aria-live="polite"></div>
      <form id="chatForm" autocomplete="off">
        <label id="chatMode" for="chatInput">제미니에게 말하기</label>
        <input id="chatInput" type="text" maxlength="300" placeholder="Enter 키로 여기에 입력, Enter로 전송, Esc로 취소">
        <button type="submit">보내기</button>
        <button type="button" id="restart" hidden>다시 시작</button>
      </form>
    </div>
  </div>

  <!-- file:// 에서는 type="module"이 막히므로 일반 script를 순서대로 불러온다 -->
  <script src="config.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/quickwords.js"></script>
  <script src="js/api.js"></script>
  <script src="js/world.js"></script>
  <script src="js/hack.js"></script>
  <script src="js/follower.js"></script>
  <script src="js/state.js"></script>
  <script src="js/drone.js"></script>
  <script src="js/offers.js"></script>
  <script src="js/chatter.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/warden.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
